name: Update trackers

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python test_merge.py

      - name: Generate trackers
        run: python merge.py

      - name: Commit and push
        run: |
          git config --local user.name ModChino
          git config --local user.email ModChino@users.noreply.github.com
          git add default_all.txt aria2_all.txt SpaceLine_All.txt best/ README.md
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "update trackers $(date -u +%Y-%m-%d)"
          git push
