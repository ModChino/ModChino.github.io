<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModChino · BT Tracker 集</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --line: #e5e5ea;
    --accent: #007aff;
    --code-bg: #f2f2f7;
    --code-border: #d9d9de;
    --copy-bg: #f2f2f7;
    --copy-hover: #e5e5ea;
    --ok: #34c759;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --muted: #98989d;
      --line: #2c2c2e;
      --accent: #0a84ff;
      --code-bg: #17171a;
      --code-border: #3a3a3c;
      --copy-bg: #2a2a2c;
      --copy-hover: #3a3a3c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 48px 20px 64px; }
  header { margin-bottom: 32px; }
  h1 { font-size: 24px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.3px; }
  .sub { color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 16px 14px;
    margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .name { font-weight: 600; font-size: 15px; }
  .copy {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--copy-bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
    transition: background .15s ease;
  }
  .copy:hover { background: var(--copy-hover); }
  .copy svg { width: 14px; height: 14px; }
  .copy.ok { color: var(--ok); border-color: rgba(52,199,89,.4); }
  .code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 13px;
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 8px;
    padding: 10px 12px;
    word-break: break-all;
    overflow-wrap: anywhere;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .content-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 6px;
  }
  .content-label { font-size: 13px; color: var(--muted); }
  .copy-sm { padding: 4px 10px; font-size: 12px; }
  .content {
    width: 100%;
    min-height: 160px;
    max-height: 320px;
    resize: vertical;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 12.5px;
    line-height: 1.5;
    background: var(--code-bg);
    color: var(--text);
    border: 1px solid var(--code-border);
    border-radius: 8px;
    padding: 10px 12px;
    white-space: pre;
    overflow: auto;
  }
  .content.loading { color: var(--muted); }
  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BT Tracker 集</h1>
    <div class="sub">每日 22:00（UTC+8）自动合并 · 复制 URL 或直接复制列表内容订阅</div>
  </header>
  <div id="list"></div>
  <footer>数据源自 <a href="https://github.com/XIU2/TrackersListCollection">XIU2</a> · <a href="https://github.com/DeSireFire/animeTrackerList">animeTrackerList</a> · 备用 <a href="https://trackers.chino.one/">trackers.chino.one</a></footer>
</div>

<script>
const data = [
  { name: "默认 · 每行一个", href: "./default_all.txt" },
  { name: "ARIA2 · 逗号分隔", href: "./aria2_all.txt" },
  { name: "空行切割", href: "./SpaceLine_All.txt" },
  { name: "Best 默认 · 每行一个", href: "./best/best_default_all.txt" },
  { name: "Best ARIA2 · 逗号分隔", href: "./best/best_aria2_all.txt" },
  { name: "Best 空行切割", href: "./best/Best_SpaceLine_All.txt" },
];

const ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h8v8H4z"/><rect x="6" y="1.5" width="9" height="9" rx="1"/></svg>';
const OK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3 3 7-7"/></svg>';

function makeCopyBtn(text, label) {
  const btn = document.createElement("button");
  btn.className = "copy";
  btn.innerHTML = ICON + "<span>" + label + "</span>";
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(text);
      btn.innerHTML = OK + "<span>已复制</span>";
      btn.classList.add("ok");
      setTimeout(() => { btn.classList.remove("ok"); btn.innerHTML = ICON + "<span>" + label + "</span>"; }, 1600);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
      btn.innerHTML = OK + "<span>已复制</span>";
      btn.classList.add("ok");
      setTimeout(() => { btn.classList.remove("ok"); btn.innerHTML = ICON + "<span>" + label + "</span>"; }, 1600);
    }
  });
  return btn;
}

const list = document.getElementById("list");

data.forEach(item => {
  const url = new URL(item.href, location.href).href;

  const el = document.createElement("div");
  el.className = "card";

  // 名称 + 复制URL
  const row = document.createElement("div");
  row.className = "row";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = item.name;
  row.appendChild(name);
  row.appendChild(makeCopyBtn(url, "复制URL"));

  // URL 代码框
  const code = document.createElement("div");
  code.className = "code";
  code.textContent = url;

  // 内容区头部 + 复制内容
  const contentHead = document.createElement("div");
  contentHead.className = "content-head";
  const contentLabel = document.createElement("div");
  contentLabel.className = "content-label";
  contentLabel.textContent = "内容预览";
  const contentCopy = makeCopyBtn("", "复制内容");
  contentHead.appendChild(contentLabel);
  contentHead.appendChild(contentCopy);

  // 内容文本框
  const content = document.createElement("textarea");
  content.className = "content loading";
  content.readOnly = true;
  content.placeholder = "加载中…";
  contentCopy.disabled = true;
  contentCopy.style.opacity = .5;

  el.appendChild(row);
  el.appendChild(code);
  el.appendChild(contentHead);
  el.appendChild(content);
  list.appendChild(el);

  // 拉取该 URL 的内容
  fetch(item.href)
    .then(res => {
      if (!res.ok) throw new Error(res.status);
      return res.text();
    })
    .then(text => {
      content.value = text;
      content.classList.remove("loading");
      contentCopy.disabled = false;
      contentCopy.style.opacity = 1;
      // 让复制内容按钮读取文本框当前值
      contentCopy.addEventListener("click", async () => {
        const txt = content.value;
        try {
          await navigator.clipboard.writeText(txt);
          contentCopy.innerHTML = OK + "<span>已复制</span>";
          contentCopy.classList.add("ok");
          setTimeout(() => { contentCopy.classList.remove("ok"); contentCopy.innerHTML = ICON + "<span>复制内容</span>"; }, 1600);
        } catch (e) {
          contentCopy.innerHTML = OK + "<span>已复制</span>";
          contentCopy.classList.add("ok");
          setTimeout(() => { contentCopy.classList.remove("ok"); contentCopy.innerHTML = ICON + "<span>复制内容</span>"; }, 1600);
        }
      });
    })
    .catch(err => {
      content.value = "加载失败：" + err.message;
      content.classList.remove("loading");
    });
});
</script>
</body>
</html>
